<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Party photos · Serendipity</title>
<link rel="icon" href="icon-192.png">
<style>
  @font-face { font-family: "Booth Serif"; src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; font-display: swap; }
  :root { --olive: #8a9a3b; --olive-light: #b5c568; --olive-dark: #6f7f2a; --fg: #f4efdc; --muted: #b8b39e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Swipe viewer: one photo per screen, swipe left/right */
  #track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
           scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
           display: flex; align-items: center; justify-content: center; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 2; text-align: center; pointer-events: none;
           padding: calc(10px + env(safe-area-inset-top)) 16px 26px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
  .brand { font-family: "Booth Serif", Georgia, serif; font-style: italic; font-size: 1.5rem; line-height: 1.1;
           background: linear-gradient(180deg, var(--olive-light), var(--olive-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-family: "Booth Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; line-height: 1.15; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
           padding: 26px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75)); }
  #count { font-weight: 700; font-size: 1rem; }
  .hint { color: var(--muted); font-size: .85rem; text-align: right; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 2; background: rgba(0,0,0,.35); color: #fff;
         border: 0; font-size: 2rem; width: 46px; height: 64px; border-radius: 10px; cursor: pointer; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  @media (hover: none) { .nav { display: none; } }      /* phones: just swipe */
  #newPill { position: fixed; top: calc(90px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3;
             background: var(--olive); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: .95rem;
             box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .message { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             text-align: center; padding: 30px; color: var(--muted); line-height: 1.5; font-size: 1.05rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="track"></div>
<header><h1 id="title"></h1></header>
<button class="nav prev" id="prevBtn" aria-label="Previous photo" hidden>‹</button>
<button class="nav next" id="nextBtn" aria-label="Next photo" hidden>›</button>
<button id="newPill" hidden></button>
<footer id="foot" hidden><span id="count"></span><span class="hint" id="hint"></span></footer>
<div class="message" id="msg">Loading the party photos…</div>

<script>
const $ = id => document.getElementById(id);
const galleryId = new URLSearchParams(location.search).get('g') || '';
const track = $('track');
let photos = [], pending = null;

const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
async function fetchGallery() {
  const r = await fetch(`/.netlify/functions/gallery?g=${encodeURIComponent(galleryId)}`, { cache: 'no-store' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw Object.assign(new Error(d.error || 'Not found'), { gone: r.status === 404 });
  return d;
}
function render(d) {
  photos = d.photos;
  document.title = `${d.name} · Serendipity`;
  $('title').textContent = d.name;
  $('hint').textContent = 'Swipe for more';
  if (!photos.length) {
    $('msg').hidden = false; $('foot').hidden = true;
    $('msg').innerHTML = 'No photos yet – they’ll appear here as soon as they’re taken. 📸';
    return;
  }
  $('msg').hidden = true; $('foot').hidden = false;
  $('prevBtn').hidden = $('nextBtn').hidden = photos.length < 2;
  track.innerHTML = '';
  photos.forEach((p, i) => {
    const s = document.createElement('div'); s.className = 'slide';
    const img = document.createElement('img');
    img.alt = `Party photo ${i + 1}`;
    img.loading = i < 3 ? 'eager' : 'lazy';
    img.src = p.url;
    s.appendChild(img); track.appendChild(s);
  });
  track.scrollLeft = 0;
  updateCount();
}
const index = () => Math.round(track.scrollLeft / track.clientWidth);
function updateCount() { if (photos.length) $('count').textContent = `${index() + 1} / ${photos.length}`; }
track.addEventListener('scroll', () => requestAnimationFrame(updateCount), { passive: true });
function go(i) { track.scrollTo({ left: Math.max(0, Math.min(photos.length - 1, i)) * track.clientWidth, behavior: 'smooth' }); }
$('prevBtn').onclick = () => go(index() - 1);
$('nextBtn').onclick = () => go(index() + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(index() - 1); if (e.key === 'ArrowRight') go(index() + 1); });
window.addEventListener('resize', () => { const i = index(); track.scrollLeft = i * track.clientWidth; });

// New photos during the party: offer them with a button instead of jumping the viewer
async function checkForNew() {
  if (document.visibilityState !== 'visible') return;
  try {
    const d = await fetchGallery();
    const fresh = d.photos.filter(p => !photos.some(q => q.id === p.id)).length;
    if (!photos.length && d.photos.length) return render(d);
    if (fresh) { pending = d; $('newPill').hidden = false; $('newPill').textContent = `${fresh} new photo${fresh > 1 ? 's' : ''} – tap to see`; }
  } catch {}
}
$('newPill').onclick = () => { $('newPill').hidden = true; if (pending) render(pending); pending = null; };

(async () => {
  try { render(await fetchGallery()); }
  catch (e) {
    $('msg').textContent = e.gone ? 'This gallery has expired (party photos are kept for 7 days) or the link is wrong.'
                                  : "Couldn't load the photos – please check your connection and try again.";
  }
  setInterval(checkForNew, 30000);
})();
</script>
</body>
</html>
