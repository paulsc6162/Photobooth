<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14130d">
<meta name="robots" content="noindex, nofollow">
<title>Your photo · Serendipity</title>
<link rel="icon" href="icon-192.png">
<style>
  @font-face { font-family: "Booth Serif"; src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; font-display: swap; }
  :root { --olive: #8a9a3b; --olive-light: #b5c568; --olive-dark: #6f7f2a; --bg: #14130d; --fg: #f4efdc; --muted: #a8a38e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .brand { font-family: "Booth Serif", Georgia, serif; font-style: italic; font-size: 2.2rem; line-height: 1.2; margin: 22px 0 4px;
           background: linear-gradient(180deg, var(--olive-light), var(--olive-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { color: var(--muted); font-size: .95rem; margin: 0 16px 14px; text-align: center; }
  .photo { width: min(92vw, 520px); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #000; }
  .photo img { width: 100%; display: block; }
  .actions { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 520px); margin: 18px 0; }
  .btn { border: 0; border-radius: 999px; padding: 15px 22px; font-size: 1.05rem; font-weight: 700; background: var(--olive); color: #fff;
         text-align: center; text-decoration: none; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px #444; }
  .btn:disabled { opacity: .6; }
  .tip { color: var(--fg); font-size: 1.05rem; text-align: center; margin: 2px 0 6px; }
  .gone { color: var(--muted); padding: 40px 24px; text-align: center; line-height: 1.5; }
  footer { color: #6c6858; font-size: .8rem; padding: 10px 16px 30px; text-align: center; margin-top: auto; }
</style>
</head>
<body>
<div class="brand">Serendipity</div>
<div class="meta" id="meta">Loading your photo…</div>
<div class="photo" id="photoBox" hidden><img id="img" alt="Your photo booth photo"></div>
<div class="actions" id="actions" hidden>
  <div class="tip">📱 Take a screenshot to keep your photo</div>
  <a class="btn ghost" id="galleryLink" hidden></a>
</div>
<div class="gone" id="gone" hidden></div>
<footer>Serendipity · 21–23 High Street, Horley · Photos are deleted automatically after 7 days</footer>
<script>
const $ = id => document.getElementById(id);
const photoId = new URLSearchParams(location.search).get('i') || '';
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

(async () => {
  try {
    const r = await fetch(`/.netlify/functions/gallery?p=${encodeURIComponent(photoId)}`, { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok || !d.ok) throw Object.assign(new Error(d.error), { gone: r.status === 404 });
    $('img').src = d.url;
    $('meta').textContent = `Available until ${fmtDate(d.expires)}`;
    $('photoBox').hidden = false; $('actions').hidden = false;
    if (d.party) {
      const a = $('galleryLink'); a.hidden = false;
      a.href = `g.html?g=${encodeURIComponent(d.party.id)}`;
      a.textContent = `See all photos from ${d.party.name}`;
    }
  } catch (e) {
    $('meta').textContent = '';
    $('gone').hidden = false;
    $('gone').textContent = e.gone ? 'This photo has expired (photos are kept for 7 days) or the link is wrong.' : "Couldn't load your photo – please check your connection and try again.";
  }
})();

</script>
</body>
</html>
